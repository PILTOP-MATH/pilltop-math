<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>필탑수학 | 학습 관리</title><style>
:root{font-family:Arial,'Apple SD Gothic Neo',sans-serif;color:#e9f2fc;background:#0d1420}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{padding:20px 28px;background:#121e2e;border-bottom:1px solid #28394e;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;margin:0}small,.muted{color:#91a7c0}.wrap{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 70px)}nav{background:#111b2a;padding:20px 12px;border-right:1px solid #29384b}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#b8cbe0;padding:13px;border-radius:9px;margin:3px 0}nav button.active{background:#203b56;color:#83d0ff}main{padding:26px;max-width:1350px;width:100%;margin:auto}h2{margin:0 0 10px;font-size:25px}h3{margin:0 0 15px;font-size:17px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card,.panel{background:#182536;border:1px solid #2a3e54;border-radius:15px;padding:19px}.card strong{display:block;color:#83d0ff;font-size:30px;margin-top:8px}.panel{margin:15px 0;overflow:auto}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}input,select{background:#0f1b2a;border:1px solid #38516a;color:#edf5fc;padding:10px;border-radius:8px;max-width:100%}input[type=number]{width:110px}.primary{background:#5dbcf2;color:#081725;border:0;border-radius:9px;padding:11px 15px;font-weight:bold}.secondary{background:#253b51;color:#e7f4ff;border:1px solid #36546e;border-radius:9px;padding:10px 12px}.danger{color:#ffb3b3}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;border-bottom:1px solid #304055;padding:12px 9px;font-size:14px}th{color:#9cb2c9;font-weight:500}.hidden{display:none!important}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.formgrid label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#a8bdd1}.formgrid input,.formgrid select{width:100%}.progress{height:9px;border-radius:20px;background:#31445a;overflow:hidden}.progress>div{height:100%;background:#62c6ff}.tag{border-radius:6px;padding:4px 8px;background:#263d54;color:#b4e2ff}.notice{color:#a6bdd4;font-size:13px;line-height:1.6}.reportgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.empty{padding:30px;text-align:center;color:#a3b7cc}@media(max-width:850px){.wrap{display:block}nav{display:flex;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid #29384b}nav button{white-space:nowrap;width:auto}main{padding:15px}.cards{grid-template-columns:repeat(2,1fr)}.formgrid,.reportgrid{grid-template-columns:1fr}header{padding:16px}h2{font-size:21px}}
</style></head><body><header><div><h1>✦ PILLTOP MATH</h1><small>학원 전체 학습 관리 · 프로토타입</small></div><button class="secondary" onclick="resetDemo()">예시 데이터 초기화</button></header><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script>
const KEY='pilltop_demo_v1';const initial={students:[{id:1,name:'학생 A',grade:'중1',className:'중1-A',school:'예시중',teacher:'김선생'},{id:2,name:'학생 B',grade:'중2',className:'중2-A',school:'예시중',teacher:'이선생'},{id:3,name:'학생 C',grade:'중3',className:'중3-A',school:'샘플중',teacher:'박선생'},{id:4,name:'학생 D',grade:'중3',className:'중3-A',school:'샘플중',teacher:'박선생'}],homework:[{id:11,studentId:1,date:'2026-11-17',title:'원의 성질 p.42~47',status:'완료'},{id:12,studentId:2,date:'2026-11-17',title:'일차함수 연습',status:'부분 완료'},{id:13,studentId:3,date:'2026-11-17',title:'삼각비 심화',status:'완료'}],scores:[{id:21,studentId:1,type:'성취도평가',title:'11월 평가',score:88,date:'2026-11-15'},{id:22,studentId:2,type:'모의고사',title:'3회',score:76,date:'2026-11-14'},{id:23,studentId:3,type:'학교시험',title:'2학기 기말',score:94,date:'2026-11-13'}],progress:[{id:31,studentId:1,book:'수학의 힘 1-2',unit:'평면도형',percent:70},{id:32,studentId:2,book:'수학의 힘 2-2',unit:'도형의 닮음',percent:55},{id:33,studentId:3,book:'수학의 힘 3-2',unit:'통계',percent:90}]};let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch{data=structuredClone(initial)};let page='dashboard';const menus=[['dashboard','대시보드'],['students','학생 관리'],['homework','숙제 관리'],['scores','성적 관리'],['progress','진도 관리'],['reports','학습 리포트']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const student=id=>data.students.find(x=>x.id===Number(id));const opts=(arr,selected)=>arr.map(x=>`<option value="${esc(x.id)}" ${String(x.id)===String(selected)?'selected':''}>${esc(x.name)} (${esc(x.className)})</option>`).join('');const studentSelect=(id='')=>`<select name="studentId" required><option value="">학생 선택</option>${opts(data.students,id)}</select>`;const uid=()=>Date.now()+Math.floor(Math.random()*10000);const avg=a=>a.length?Math.round(a.reduce((s,x)=>s+Number(x),0)/a.length):0;const title=t=>`<h2>${t}</h2><p class="muted">입력 내용은 이 브라우저에만 저장됩니다.</p>`;function go(p){page=p;render()};function render(){document.getElementById('nav').innerHTML=menus.map(([p,n])=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${n}</button>`).join('');const el=document.getElementById('main');el.innerHTML=({dashboard:dashboard,students:studentsView,homework:homeworkView,scores:scoresView,progress:progressView,reports:reportsView})[page]()}function formSubmit(e,type){e.preventDefault();const obj=Object.fromEntries(new FormData(e.target));if(type==='students'){if(!obj.name.trim())return alert('이름을 입력하세요');obj.id=uid()}else{obj.id=uid();obj.studentId=Number(obj.studentId);if(!student(obj.studentId))return alert('학생을 선택하세요');if(type==='scores'){obj.score=Number(obj.score);if(obj.score<0||obj.score>100)return alert('점수는 0~100점으로 입력하세요')}if(type==='progress'){obj.percent=Number(obj.percent);if(obj.percent<0||obj.percent>100)return alert('진도율은 0~100%로 입력하세요')}}data[type].push(obj);save();render()}function remove(type,id){if(!confirm('이 기록을 삭제할까요?'))return;data[type]=data[type].filter(x=>x.id!==id);if(type==='students')for(const t of ['homework','scores','progress'])data[t]=data[t].filter(x=>x.studentId!==id);save();render()}function resetDemo(){if(confirm('저장된 변경사항을 모두 지우고 예시 데이터로 초기화할까요?')){data=structuredClone(initial);save();render()}}function dashboard(){const h=data.homework;const completed=h.filter(x=>x.status==='완료').length;return title('학습 관리 대시보드')+`<div class="cards"><div class="card">전체 학생<strong>${data.students.length}명</strong></div><div class="card">숙제 완료율<strong>${h.length?Math.round(completed/h.length*100):0}%</strong></div><div class="card">평균 평가 점수<strong>${avg(data.scores.map(x=>x.score))}점</strong></div><div class="card">평균 진도율<strong>${avg(data.progress.map(x=>x.percent))}%</strong></div></div><section class="panel"><h3>학년별 학생 수</h3>${['중1','중2','중3','고1','고2','고3'].map(g=>`<p>${g} <span class="tag">${data.students.filter(s=>s.grade===g).length}명</span></p>`).join('')}</section><section class="panel"><h3>최근 성적 기록</h3>${table(['학생','평가','점수'],data.scores.slice(-5).reverse().map(x=>[esc(student(x.studentId)?.name||'삭제된 학생'),esc(x.title),esc(x.score)+'점']))}</section>`}function table(headers,rows){return rows.length?`<table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">아직 등록된 기록이 없습니다.</div>'}function studentsView(){return title('학생 관리')+`<section class="panel"><h3>학생 등록</h3><form onsubmit="formSubmit(event,'students')"><div class="formgrid">${[['name','학생 이름'],['school','학교'],['className','반'],['teacher','담당 선생님']].map(([k,v])=>`<label>${v}<input name="${k}" required placeholder="${v}"></label>`).join('')}<label>학년<select name="grade">${['중1','중2','중3','고1','고2','고3'].map(g=>`<option>${g}</option>`).join('')}</select></label></div><p><button class="primary">학생 등록</button></p></form></section><section class="panel"><div class="toolbar"><h3 style="margin-right:auto">학생 목록</h3><input id="search" placeholder="이름·학교·반 검색" oninput="filterStudents()"><select id="gradeFilter" onchange="filterStudents()"><option value="">전체 학년</option>${['중1','중2','중3','고1','고2','고3'].map(g=>`<option>${g}</option>`).join('')}</select></div><div id="studentRows"></div></section>`+(setTimeout(filterStudents,0),'')}function filterStudents(){const el=document.getElementById('studentRows');if(!el)return;const q=document.getElementById('search').value.toLowerCase(),g=document.getElementById('gradeFilter').value;const rows=data.students.filter(x=>(!g||x.grade===g)&&[x.name,x.school,x.className,x.teacher].join(' ').toLowerCase().includes(q)).map(x=>[esc(x.name),esc(x.grade),esc(x.school),esc(x.className),esc(x.teacher),`<button class="secondary" onclick="editStudent(${x.id})">수정</button> <button class="secondary danger" onclick="remove('students',${x.id})">삭제</button>`]);el.innerHTML=table(['이름','학년','학교','반','담당','관리'],rows)}function editStudent(id){const s=student(id);if(!s)return;const fields=[['name','이름'],['school','학교'],['className','반'],['teacher','담당 선생님'],['grade','학년']];for(const [k,label] of fields){const v=prompt(label+' 수정',s[k]);if(v===null)return;if(!v.trim())return alert('빈 값은 저장할 수 없습니다');s[k]=v.trim()}save();render()}function homeworkView(){return title('숙제 관리')+`<section class="panel"><h3>숙제 기록 추가</h3><form onsubmit="formSubmit(event,'homework')"><div class="formgrid"><label>학생${studentSelect()}</label><label>날짜<input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"></label><label>숙제 범위<input name="title" required placeholder="교재 및 페이지"></label><label>이행 상태<select name="status">${['완료','부분 완료','미완료','미제출'].map(s=>`<option>${s}</option>`).join('')}</select></label></div><p><button class="primary">기록 저장</button></p></form></section><section class="panel"><h3>숙제 기록</h3>${table(['날짜','학생','숙제','상태','관리'],[...data.homework].reverse().map(x=>[esc(x.date),esc(student(x.studentId)?.name),esc(x.title),`<select onchange="updateStatus(${x.id},this.value)">${['완료','부분 완료','미완료','미제출'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select>`,`<button class="secondary danger" onclick="remove('homework',${x.id})">삭제</button>`]))}</section>`}function updateStatus(id,v){const x=data.homework.find(x=>x.id===id);if(x){x.status=v;save()}}function scoresView(){return title('성적 관리')+`<section class="panel"><h3>평가 기록 추가</h3><form onsubmit="formSubmit(event,'scores')"><div class="formgrid"><label>학생${studentSelect()}</label><label>시험 유형<select name="type">${['성취도평가','모의고사','학교시험','재시험'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>평가명<input name="title" required placeholder="예: 11월 2회"></label><label>점수<input type="number" name="score" min="0" max="100" required></label><label>시험일<input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"></label></div><p><button class="primary">점수 저장</button></p></form></section><section class="panel"><h3>평가 기록</h3>${table(['일자','학생','유형','평가','점수','관리'],[...data.scores].reverse().map(x=>[esc(x.date),esc(student(x.studentId)?.name),esc(x.type),esc(x.title),esc(x.score)+'점',`<button class="secondary danger" onclick="remove('scores',${x.id})">삭제</button>`]))}</section>`}function progressView(){return title('진도 관리')+`<section class="panel"><h3>진도 기록 추가</h3><form onsubmit="formSubmit(event,'progress')"><div class="formgrid"><label>학생${studentSelect()}</label><label>교재<input name="book" required placeholder="교재명"></label><label>현재 단원<input name="unit" required placeholder="단원명"></label><label>진도율 (%)<input type="number" name="percent" min="0" max="100" required></label></div><p><button class="primary">진도 저장</button></p></form></section><section class="panel"><h3>진도 기록</h3>${table(['학생','교재','단원','진도','관리'],[...data.progress].reverse().map(x=>[esc(student(x.studentId)?.name),esc(x.book),esc(x.unit),`<div style="min-width:120px">${esc(x.percent)}%<div class="progress"><div style="width:${Number(x.percent)}%"></div></div></div>`,`<button class="secondary danger" onclick="remove('progress',${x.id})">삭제</button>`]))}</section>`}function reportsView(){return title('학생별 웹 학습 리포트')+`<section class="panel"><div class="toolbar"><label>조회 학생 </label><select id="reportStudent" onchange="showReport()">${opts(data.students,data.students[0]?.id)}</select></div><div id="reportBody"></div></section><p class="notice">학부모 로그인과 공유 기능은 아직 구현되지 않았습니다. 이 페이지는 관리자용 조회 프로토타입입니다.</p>`+(setTimeout(showReport,0),'')}function showReport(){const id=Number(document.getElementById('reportStudent')?.value),s=student(id),el=document.getElementById('reportBody');if(!el)return;if(!s){el.innerHTML='<p>학생을 먼저 등록해 주세요.</p>';return}const h=data.homework.filter(x=>x.studentId===id),sc=data.scores.filter(x=>x.studentId===id),p=data.progress.filter(x=>x.studentId===id);el.innerHTML=`<h3>${esc(s.name)} · ${esc(s.grade)} · ${esc(s.className)}</h3><p class="muted">${esc(s.school)} / 담당 ${esc(s.teacher)}</p><div class="reportgrid"><div class="card">숙제 완료율<strong>${h.length?Math.round(h.filter(x=>x.status==='완료').length/h.length*100):0}%</strong></div><div class="card">평균 평가 점수<strong>${sc.length?avg(sc.map(x=>x.score))+'점':'기록 없음'}</strong></div><div class="card">평균 진도율<strong>${p.length?avg(p.map(x=>x.percent))+'%':'기록 없음'}</strong></div></div><h3 style="margin-top:24px">최근 숙제</h3>${table(['날짜','숙제','상태'],h.slice(-5).reverse().map(x=>[esc(x.date),esc(x.title),esc(x.status)]))}<h3 style="margin-top:24px">평가 결과</h3>${table(['시험일','평가명','점수'],sc.slice().reverse().map(x=>[esc(x.date),esc(x.title),esc(x.score)+'점']))}<h3 style="margin-top:24px">학습 진도</h3>${table(['교재','단원','진도율'],p.map(x=>[esc(x.book),esc(x.unit),esc(x.percent)+'%']))}`};render();
</script></body></html>
