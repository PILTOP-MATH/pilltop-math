<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>필탑수학 | 학습 관리</title><style>
:root{font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#f7f7f7;background:#080808;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{padding:19px 24px;border-bottom:1px solid #303030;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:20px;font-weight:800}.muted{color:#aaa;font-size:13px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 75px)}aside{padding:18px 12px;background:#101010;border-right:1px solid #303030}aside button{width:100%;text-align:left;background:none;color:#aaa;border:0;padding:13px;border-radius:9px}aside button.active,aside button:hover{background:#303030;color:#fff}main{padding:26px;max-width:1200px;width:100%;margin:0 auto}h1{font-size:26px;margin:0 0 8px}h2{font-size:17px;margin:0 0 14px}.panel,.card{background:#1b1b1b;border:1px solid #343434;border-radius:14px;padding:20px;margin:16px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cards .card{margin:0}.card strong{display:block;font-size:30px;margin-top:10px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#ccc}input,select{background:#101010;border:1px solid #555;border-radius:8px;padding:11px;color:#fff;width:100%;min-width:0}button.primary{background:#fff;color:#111;border:0;padding:11px 16px;border-radius:8px;font-weight:700}button.secondary{background:#292929;color:#fff;border:1px solid #555;padding:9px 12px;border-radius:8px}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:15px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{padding:12px 8px;border-bottom:1px solid #353535;text-align:left;font-size:14px}th{color:#aaa;font-weight:500}.error{color:#ffaaaa;white-space:pre-wrap}.success{color:#a3e5b2}.notice{border-left:3px solid #aaa;padding:12px;background:#222;color:#ccc;font-size:13px;line-height:1.6}.auth{max-width:460px;margin:8vh auto;padding:24px}.hide{display:none!important}@media(max-width:760px){.shell{display:block}aside{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid #333;padding:8px}aside button{white-space:nowrap;width:auto}main{padding:16px}.cards{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}header{padding:14px}}

/* 모바일: 반·학생 목록을 가로로 잘리는 표 대신 카드로 표시 */
@media(max-width:760px){
  .tablewrap{overflow-x:visible;min-width:0}
  .tablewrap table{min-width:0;width:100%;display:block}
  .tablewrap thead{display:none}
  .tablewrap tbody{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
  .tablewrap tbody tr{display:block;min-width:0;background:#141414;border:1px solid #383838;border-radius:12px;padding:10px 14px}
  .tablewrap tbody td{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-width:0;width:100%;padding:9px 0;border-bottom:1px solid #2e2e2e;text-align:right;overflow-wrap:anywhere;word-break:break-word;white-space:normal}
  .tablewrap tbody td:last-child{border-bottom:0}
  .tablewrap tbody td::before{content:attr(data-label);flex:0 0 76px;color:#aaa;font-size:13px;text-align:left;white-space:nowrap}
  .tablewrap tbody td:first-child{font-weight:700;color:#fff}
  .tablewrap tbody td[colspan]{display:block;text-align:center;color:#aaa}
  .tablewrap tbody td[colspan]::before{display:none}
  .tablewrap tbody td .secondary{font-size:13px;padding:7px 9px}
  .panel{padding:16px}
}
</style></head><body><header><div><div class="logo">✦ PILLTOP MATH</div><div class="muted">학습 관리 시스템 · 관리자 테스트</div></div><div id="sessionInfo" class="muted"></div></header><div id="setup" class="auth panel"><h1>Supabase 연결 설정</h1><p class="muted">처음 한 번만 프로젝트 URL과 Publishable key를 입력해 주세요. 이 브라우저에만 저장됩니다.</p><form id="setupForm"><label>Project URL<input id="url" type="url" required placeholder="https://xxxxx.supabase.co" autocomplete="off"></label><br><label>Publishable key<input id="key" required placeholder="sb_publishable_..." autocomplete="off"></label><p class="notice">반드시 <b>Publishable key</b>만 사용하세요. Secret / service_role 키나 DB 비밀번호는 입력하지 마세요. GitHub 파일에 키를 직접 저장할 필요가 없습니다.</p><button class="primary">연결 설정 저장</button></form><p id="setupError" class="error"></p></div><div id="login" class="auth panel hide"><h1>관리자 로그인</h1><p class="muted">Supabase Authentication에 등록한 계정으로 로그인하세요.</p><form id="loginForm"><label>이메일<input id="email" type="email" required autocomplete="username"></label><br><label>비밀번호<input id="password" type="password" required autocomplete="current-password"></label><div class="actions"><button class="primary">로그인</button><button type="button" class="secondary" id="changeConfig">연결 설정 변경</button></div></form><p id="loginError" class="error"></p></div><div id="app" class="shell hide"><aside id="nav"></aside><main id="content"></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const configKey='pilltop_supabase_config_v1';let client=null,me=null,page='dashboard',classes=[],students=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const show=id=>['setup','login','app'].forEach(x=>$(x).classList.toggle('hide',x!==id));const menus=[['dashboard','대시보드'],['students','학생 관리'],['classes','반 관리'],['homework','숙제 관리'],['scores','성적 관리'],['progress','진도 관리'],['notices','공지사항']];function initClient(c){if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(c.url)||!/^sb_publishable_/.test(c.key))throw Error('Supabase Project URL과 Publishable key를 확인해 주세요.');if(!window.supabase)throw Error('Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');client=window.supabase.createClient(c.url.replace(/\/$/,''),c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}})}async function boot(){let c;try{c=JSON.parse(localStorage.getItem(configKey)||'null');if(!c){show('setup');return}initClient(c);const {data:{user},error}=await client.auth.getUser();if(error||!user){show('login');return}me=user;await load()}catch(e){show('setup');$('setupError').textContent=e.message}}$('setupForm').onsubmit=async e=>{e.preventDefault();$('setupError').textContent='';const c={url:$('url').value.trim(),key:$('key').value.trim()};try{initClient(c);localStorage.setItem(configKey,JSON.stringify(c));show('login')}catch(err){$('setupError').textContent=err.message}};$('changeConfig').onclick=()=>{const c=JSON.parse(localStorage.getItem(configKey)||'null');if(c){$('url').value=c.url;$('key').value=c.key}show('setup')};$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const button=e.target.querySelector('button');button.disabled=true;try{const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;me=data.user;$('password').value='';await load()}catch(err){$('loginError').textContent=err.message}finally{button.disabled=false}};async function logout(){await client.auth.signOut();me=null;students=[];classes=[];show('login')};async function load(){try{const [a,b]=await Promise.all([client.from('classes').select('id,name,grade,teacher_name,schedule,created_at').order('created_at',{ascending:false}),client.from('students').select('id,name,school,grade,class_id,created_at').order('created_at',{ascending:false})]);if(a.error)throw a.error;if(b.error)throw b.error;classes=a.data;students=b.data;show('app');$('sessionInfo').innerHTML=`${esc(me.email)} <button class="secondary" onclick="logout()">로그아웃</button>`;render()}catch(err){show('login');$('loginError').textContent='데이터 조회 실패: '+err.message+'\n관리자 역할 및 RLS 정책을 확인해 주세요.'}}function go(p){page=p;render()}function render(){$('nav').innerHTML=menus.map(([p,n])=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${n}</button>`).join('');$('content').innerHTML=({dashboard:dashboard,students:studentsPage,classes:classesPage})[page]?.()||`<h1>${menus.find(m=>m[0]===page)[1]}</h1><div class="panel"><p class="notice">이 메뉴는 이전 프로토타입의 구성만 유지했습니다. 온라인 저장 및 접근 권한 설계 후 다음 단계에서 연결할 예정입니다. 현재는 학생·반 관리만 실제 Supabase에 저장됩니다.</p></div>`}function dashboard(){return `<h1>학습 관리 대시보드</h1><p class="muted">Supabase에 저장된 실제 등록 건수</p><div class="cards"><div class="card">등록 학생<strong>${students.length}명</strong></div><div class="card">등록 반<strong>${classes.length}개</strong></div><div class="card">연결 상태<strong style="font-size:19px">정상</strong></div></div><div class="panel"><h2>시작하기</h2><p class="muted">먼저 반을 만들고 학생을 등록해 주세요. 로그인 권한을 설정한 관리자만 조회·수정할 수 있습니다.</p><p class="notice">현재 공개 GitHub Pages 주소는 누구나 방문할 수 있지만, 학생 데이터는 로그인 및 데이터베이스 RLS 정책으로 보호됩니다. 실제 학생 정보 입력 전 학원 개인정보 처리 절차와 권한 검증이 필요합니다.</p></div>`}function classesPage(){return `<h1>반 관리</h1><p class="muted">반을 등록하고 담당 선생님 및 시간표를 관리합니다.</p><section class="panel"><h2>반 등록</h2><form onsubmit="addClass(event)"><div class="fields"><label>반 이름<input name="name" required maxlength="80" placeholder="중3-2반"></label><label>학년<input name="grade" maxlength="30" placeholder="중3"></label><label>담당 선생님<input name="teacher_name" maxlength="80"></label><label>시간표<input name="schedule" maxlength="200" placeholder="월·수 19:00~22:00"></label></div><div class="actions"><button class="primary">반 등록</button></div></form></section><section class="panel"><h2>반 목록</h2><div class="tablewrap"><table><thead><tr><th>반</th><th>학년</th><th>담당</th><th>시간표</th><th>학생 수</th><th>관리</th></tr></thead><tbody>${classes.map(c=>`<tr><td data-label="반">${esc(c.name)}</td><td data-label="학년">${esc(c.grade)}</td><td data-label="담당">${esc(c.teacher_name)}</td><td data-label="시간표">${esc(c.schedule)}</td><td data-label="학생 수">${students.filter(s=>s.class_id===c.id).length}</td><td data-label="관리"><button class="secondary" onclick="editClass('${c.id}')">수정</button> <button class="secondary" onclick="deleteRow('classes','${c.id}')">삭제</button></td></tr>`).join('')||'<tr><td colspan="6">등록된 반이 없습니다.</td></tr>'}</tbody></table></div></section>`}function studentsPage(){return `<h1>학생 관리</h1><p class="muted">학생을 등록하고 반을 배정합니다.</p><section class="panel"><h2>학생 등록</h2><form onsubmit="addStudent(event)"><div class="fields"><label>학생 이름<input name="name" required maxlength="80"></label><label>학교<input name="school" maxlength="100"></label><label>학년<select name="grade">${['중1','중2','중3','고1','고2','고3'].map(g=>`<option>${g}</option>`).join('')}</select></label><label>소속 반<select name="class_id"><option value="">미배정</option>${classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label></div><div class="actions"><button class="primary">학생 등록</button></div></form></section><section class="panel"><h2>학생 목록</h2><label>검색<input id="search" oninput="filterStudents()" placeholder="학생 이름, 학교 검색"></label><div class="tablewrap" id="studentTable"></div></section>`+(setTimeout(filterStudents,0),'')}function filterStudents(){const el=$('studentTable');if(!el)return;const q=$('search').value.toLowerCase();const rows=students.filter(s=>(s.name+' '+(s.school||'')).toLowerCase().includes(q));el.innerHTML=`<table><thead><tr><th>이름</th><th>학교</th><th>학년</th><th>반</th><th>관리</th></tr></thead><tbody>${rows.map(s=>`<tr><td data-label="이름">${esc(s.name)}</td><td data-label="학교">${esc(s.school)}</td><td data-label="학년">${esc(s.grade)}</td><td data-label="반">${esc(classes.find(c=>c.id===s.class_id)?.name||'미배정')}</td><td data-label="관리"><button class="secondary" onclick="editStudent('${s.id}')">수정</button> <button class="secondary" onclick="deleteRow('students','${s.id}')">삭제</button></td></tr>`).join('')||'<tr><td colspan="5">등록된 학생이 없습니다.</td></tr>'}</tbody></table>`}async function write(table,method,payload,id){try{let q=client.from(table);const result=method==='insert'?await q.insert(payload):method==='update'?await q.update(payload).eq('id',id):await q.delete().eq('id',id);if(result.error)throw result.error;await load()}catch(e){alert('저장 실패: '+e.message)}}async function addClass(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));await write('classes','insert',{name:d.name.trim(),grade:d.grade.trim()||null,teacher_name:d.teacher_name.trim()||null,schedule:d.schedule.trim()||null})}async function addStudent(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));await write('students','insert',{name:d.name.trim(),school:d.school.trim()||null,grade:d.grade,class_id:d.class_id||null})}async function editClass(id){const c=classes.find(x=>x.id===id);if(!c)return;const name=prompt('반 이름',c.name);if(name===null)return;if(!name.trim())return alert('반 이름을 입력하세요');const grade=prompt('학년',c.grade||'');if(grade===null)return;const teacher_name=prompt('담당 선생님',c.teacher_name||'');if(teacher_name===null)return;const schedule=prompt('시간표',c.schedule||'');if(schedule===null)return;await write('classes','update',{name:name.trim(),grade:grade.trim()||null,teacher_name:teacher_name.trim()||null,schedule:schedule.trim()||null},id)}async function editStudent(id){const s=students.find(x=>x.id===id);if(!s)return;const name=prompt('학생 이름',s.name);if(name===null)return;if(!name.trim())return alert('이름을 입력하세요');const school=prompt('학교',s.school||'');if(school===null)return;const grade=prompt('학년',s.grade||'');if(grade===null)return;const options=classes.map(c=>c.name).join(', ');const className=prompt('반 이름 (비워두면 미배정)\n선택 가능: '+options,classes.find(c=>c.id===s.class_id)?.name||'');if(className===null)return;const chosen=className.trim()?classes.find(c=>c.name===className.trim()):null;if(className.trim()&&!chosen)return alert('등록된 반 이름을 정확히 입력해 주세요');await write('students','update',{name:name.trim(),school:school.trim()||null,grade:grade.trim()||null,class_id:chosen?.id||null},id)}async function deleteRow(table,id){if(!confirm('정말 삭제할까요?'))return;await write(table,'delete',null,id)}boot();
</script></body></html>
