<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>필탑수학 | 학습 관리</title><style>
:root{font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#f7f7f7;background:#080808;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{padding:19px 24px;border-bottom:1px solid #303030;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:20px;font-weight:800}.muted{color:#aaa;font-size:13px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 75px)}aside{padding:18px 12px;background:#101010;border-right:1px solid #303030}aside button{width:100%;text-align:left;background:none;color:#aaa;border:0;padding:13px;border-radius:9px}aside button.active,aside button:hover{background:#303030;color:#fff}main{padding:26px;max-width:1200px;width:100%;margin:0 auto}h1{font-size:26px;margin:0 0 8px}h2{font-size:17px;margin:0 0 14px}.panel,.card{background:#1b1b1b;border:1px solid #343434;border-radius:14px;padding:20px;margin:16px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cards .card{margin:0}.card strong{display:block;font-size:30px;margin-top:10px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#ccc}input,select{background:#101010;border:1px solid #555;border-radius:8px;padding:11px;color:#fff;width:100%;min-width:0}button.primary{background:#fff;color:#111;border:0;padding:11px 16px;border-radius:8px;font-weight:700}button.secondary{background:#292929;color:#fff;border:1px solid #555;padding:9px 12px;border-radius:8px}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:15px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{padding:12px 8px;border-bottom:1px solid #353535;text-align:left;font-size:14px}th{color:#aaa;font-weight:500}.error{color:#ffaaaa;white-space:pre-wrap}.success{color:#a3e5b2}.notice{border-left:3px solid #aaa;padding:12px;background:#222;color:#ccc;font-size:13px;line-height:1.6}.auth{max-width:460px;margin:8vh auto;padding:24px}.hide{display:none!important}@media(max-width:760px){.shell{display:block}aside{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid #333;padding:8px}aside button{white-space:nowrap;width:auto}main{padding:16px}.cards{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}header{padding:14px}}

/* 모바일: 반·학생 목록을 가로로 잘리는 표 대신 카드로 표시 */
@media(max-width:760px){
  .tablewrap{overflow-x:visible;min-width:0}
  .tablewrap table{min-width:0;width:100%;display:block}
  .tablewrap thead{display:none}
  .tablewrap tbody{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
  .tablewrap tbody tr{display:block;min-width:0;background:#141414;border:1px solid #383838;border-radius:12px;padding:10px 14px}
  .tablewrap tbody td{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-width:0;width:100%;padding:9px 0;border-bottom:1px solid #2e2e2e;text-align:right;overflow-wrap:anywhere;word-break:break-word;white-space:normal}
  .tablewrap tbody td:last-child{border-bottom:0}
  .tablewrap tbody td::before{content:attr(data-label);flex:0 0 76px;color:#aaa;font-size:13px;text-align:left;white-space:nowrap}
  .tablewrap tbody td:first-child{font-weight:700;color:#fff}
  .tablewrap tbody td[colspan]{display:block;text-align:center;color:#aaa}
  .tablewrap tbody td[colspan]::before{display:none}
  .tablewrap tbody td .secondary{font-size:13px;padding:7px 9px}
  .panel{padding:16px}
}

/* Edit modal — desktop and mobile */
body.modal-open{overflow:hidden}
.edit-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.76);display:flex;align-items:center;justify-content:center;padding:16px}
.edit-dialog{background:#1b1b1b;border:1px solid #4b4b4b;border-radius:16px;width:min(100%,520px);max-height:calc(100dvh - 32px);overflow-y:auto;padding:24px;box-shadow:0 18px 65px rgba(0,0,0,.55)}
.edit-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.edit-head h2{margin:0;font-size:21px}
.edit-close{border:0;background:transparent;color:#ddd;font-size:27px;line-height:1;padding:4px 8px}
.edit-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.edit-fields .wide{grid-column:1/-1}
.edit-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.edit-error{color:#ffaaaa;font-size:13px;min-height:0;margin:8px 0 0}
@media(max-width:520px){.edit-overlay{padding:10px;align-items:center}.edit-dialog{padding:18px;max-height:calc(100dvh - 20px)}.edit-fields{grid-template-columns:1fr}.edit-fields .wide{grid-column:auto}.edit-actions button{flex:1}}

/* 학습 기록 관리 */
.record-toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.record-toolbar button{height:43px}.record-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(120px,1fr) minmax(120px,1fr);gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #333}
.record-row:last-child{border-bottom:0}.record-row .muted{font-size:12px}.record-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.record-tabs button.active{background:#fff;color:#111}.record-help{font-size:13px;color:#aaa;line-height:1.7}.record-stat{display:flex;gap:12px;flex-wrap:wrap}.record-stat span{padding:9px 12px;background:#262626;border-radius:8px}
@media(max-width:760px){.record-toolbar{grid-template-columns:1fr}.record-row{grid-template-columns:1fr 1fr}.record-row .record-name{grid-column:1/-1}.record-stat{display:grid;grid-template-columns:1fr 1fr}}

/* 월말평가 성적 관리 */
.score-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.score-tabs button.active{background:#fff;color:#111}
.score-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
.score-grid button{min-height:43px}
.score-line{display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,170px);align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #333}
.score-line:last-child{border-bottom:0}
.score-line input{max-width:170px}
.score-stat{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.score-stat span{padding:10px 12px;background:#262626;border-radius:8px}
@media(max-width:760px){.score-grid{grid-template-columns:1fr}.score-line{grid-template-columns:minmax(0,1fr) minmax(100px,140px)}}

/* 월간 통계 */
.stat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.stat-tabs button.active{background:#fff;color:#111}
.stat-filter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.stat-filter button{min-height:43px}
.stat-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.stat-card{background:#222;border:1px solid #383838;border-radius:12px;padding:16px}
.stat-card small{color:#aaa;display:block}.stat-card strong{font-size:25px;display:block;margin:9px 0 3px}
.stat-card em{font-style:normal;color:#aaa;font-size:12px}
.stat-chart{width:100%;overflow-x:auto}
.stat-chart svg{display:block;min-width:520px;width:100%;height:auto}
.stat-legend{display:flex;gap:16px;flex-wrap:wrap;color:#ccc;font-size:12px}
.stat-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
@media(max-width:760px){.stat-filter{grid-template-columns:1fr}.stat-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><div><div class="logo">✦ PILLTOP MATH</div><div class="muted">학습 관리 시스템 · 관리자 테스트</div></div><div id="sessionInfo" class="muted"></div></header><div id="setup" class="auth panel"><h1>Supabase 연결 설정</h1><p class="muted">처음 한 번만 프로젝트 URL과 Publishable key를 입력해 주세요. 이 브라우저에만 저장됩니다.</p><form id="setupForm"><label>Project URL<input id="url" type="url" required placeholder="https://xxxxx.supabase.co" autocomplete="off"></label><br><label>Publishable key<input id="key" required placeholder="sb_publishable_..." autocomplete="off"></label><p class="notice">반드시 <b>Publishable key</b>만 사용하세요. Secret / service_role 키나 DB 비밀번호는 입력하지 마세요. GitHub 파일에 키를 직접 저장할 필요가 없습니다.</p><button class="primary">연결 설정 저장</button></form><p id="setupError" class="error"></p></div><div id="login" class="auth panel hide"><h1>관리자 로그인</h1><p class="muted">Supabase Authentication에 등록한 계정으로 로그인하세요.</p><form id="loginForm"><label>이메일<input id="email" type="email" required autocomplete="username"></label><br><label>비밀번호<input id="password" type="password" required autocomplete="current-password"></label><div class="actions"><button class="primary">로그인</button><button type="button" class="secondary" id="changeConfig">연결 설정 변경</button></div></form><p id="loginError" class="error"></p></div><div id="app" class="shell hide"><aside id="nav"></aside><main id="content"></main></div><div id="editModalRoot"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const configKey='pilltop_supabase_config_v1';let client=null,me=null,page='dashboard',classes=[],students=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const show=id=>['setup','login','app'].forEach(x=>$(x).classList.toggle('hide',x!==id));const menus=[['dashboard','대시보드'],['students','학생 관리'],['classes','반 관리'],['homework','학습 기록 관리'],['scores','성적 관리'],['statistics','월간 통계'],['progress','진도 관리'],['notices','공지사항']];function initClient(c){if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(c.url)||!/^sb_publishable_/.test(c.key))throw Error('Supabase Project URL과 Publishable key를 확인해 주세요.');if(!window.supabase)throw Error('Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');client=window.supabase.createClient(c.url.replace(/\/$/,''),c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}})}async function boot(){let c;try{c=JSON.parse(localStorage.getItem(configKey)||'null');if(!c){show('setup');return}initClient(c);const {data:{user},error}=await client.auth.getUser();if(error||!user){show('login');return}me=user;await load()}catch(e){show('setup');$('setupError').textContent=e.message}}$('setupForm').onsubmit=async e=>{e.preventDefault();$('setupError').textContent='';const c={url:$('url').value.trim(),key:$('key').value.trim()};try{initClient(c);localStorage.setItem(configKey,JSON.stringify(c));show('login')}catch(err){$('setupError').textContent=err.message}};$('changeConfig').onclick=()=>{const c=JSON.parse(localStorage.getItem(configKey)||'null');if(c){$('url').value=c.url;$('key').value=c.key}show('setup')};$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const button=e.target.querySelector('button');button.disabled=true;try{const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;me=data.user;$('password').value='';await load()}catch(err){$('loginError').textContent=err.message}finally{button.disabled=false}};async function logout(){await client.auth.signOut();me=null;students=[];classes=[];show('login')};async function load(){try{const [a,b]=await Promise.all([client.from('classes').select('id,name,grade,teacher_name,schedule,created_at').order('created_at',{ascending:false}),client.from('students').select('id,name,school,grade,class_id,created_at').order('created_at',{ascending:false})]);if(a.error)throw a.error;if(b.error)throw b.error;classes=a.data;students=b.data;show('app');$('sessionInfo').innerHTML=`${esc(me.email)} <button class="secondary" onclick="logout()">로그아웃</button>`;render()}catch(err){show('login');$('loginError').textContent='데이터 조회 실패: '+err.message+'\n관리자 역할 및 RLS 정책을 확인해 주세요.'}}function go(p){page=p;render()}function render(){$('nav').innerHTML=menus.map(([p,n])=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${n}</button>`).join('');$('content').innerHTML=({dashboard:dashboard,students:studentsPage,classes:classesPage,homework:homeworkPage,scores:scoresPage,statistics:statisticsPage})[page]?.()||`<h1>${menus.find(m=>m[0]===page)[1]}</h1><div class="panel"><p class="notice">이 메뉴는 이전 프로토타입의 구성만 유지했습니다. 온라인 저장 및 접근 권한 설계 후 다음 단계에서 연결할 예정입니다. 현재는 학생·반 관리만 실제 Supabase에 저장됩니다.</p></div>`}function dashboard(){return `<h1>학습 관리 대시보드</h1><p class="muted">Supabase에 저장된 실제 등록 건수</p><div class="cards"><div class="card">등록 학생<strong>${students.length}명</strong></div><div class="card">등록 반<strong>${classes.length}개</strong></div><div class="card">연결 상태<strong style="font-size:19px">정상</strong></div></div><div class="panel"><h2>시작하기</h2><p class="muted">먼저 반을 만들고 학생을 등록해 주세요. 로그인 권한을 설정한 관리자만 조회·수정할 수 있습니다.</p><p class="notice">현재 공개 GitHub Pages 주소는 누구나 방문할 수 있지만, 학생 데이터는 로그인 및 데이터베이스 RLS 정책으로 보호됩니다. 실제 학생 정보 입력 전 학원 개인정보 처리 절차와 권한 검증이 필요합니다.</p></div>`}function classesPage(){return `<h1>반 관리</h1><p class="muted">반을 등록하고 담당 선생님 및 시간표를 관리합니다.</p><section class="panel"><h2>반 등록</h2><form onsubmit="addClass(event)"><div class="fields"><label>반 이름<input name="name" required maxlength="80" placeholder="중3-2반"></label><label>학년<input name="grade" maxlength="30" placeholder="중3"></label><label>담당 선생님<input name="teacher_name" maxlength="80"></label><label>시간표<input name="schedule" maxlength="200" placeholder="월·수 19:00~22:00"></label></div><div class="actions"><button class="primary">반 등록</button></div></form></section><section class="panel"><h2>반 목록</h2><div class="tablewrap"><table><thead><tr><th>반</th><th>학년</th><th>담당</th><th>시간표</th><th>학생 수</th><th>관리</th></tr></thead><tbody>${classes.map(c=>`<tr><td data-label="반">${esc(c.name)}</td><td data-label="학년">${esc(c.grade)}</td><td data-label="담당">${esc(c.teacher_name)}</td><td data-label="시간표">${esc(c.schedule)}</td><td data-label="학생 수">${students.filter(s=>s.class_id===c.id).length}</td><td data-label="관리"><button class="secondary" onclick="editClass('${c.id}')">수정</button> <button class="secondary" onclick="deleteRow('classes','${c.id}')">삭제</button></td></tr>`).join('')||'<tr><td colspan="6">등록된 반이 없습니다.</td></tr>'}</tbody></table></div></section>`}function studentsPage(){return `<h1>학생 관리</h1><p class="muted">학생을 등록하고 반을 배정합니다.</p><section class="panel"><h2>학생 등록</h2><form onsubmit="addStudent(event)"><div class="fields"><label>학생 이름<input name="name" required maxlength="80"></label><label>학교<input name="school" maxlength="100"></label><label>학년<select name="grade">${['중1','중2','중3','고1','고2','고3'].map(g=>`<option>${g}</option>`).join('')}</select></label><label>소속 반<select name="class_id"><option value="">미배정</option>${classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label></div><div class="actions"><button class="primary">학생 등록</button></div></form></section><section class="panel"><h2>학생 목록</h2><label>검색<input id="search" oninput="filterStudents()" placeholder="학생 이름, 학교 검색"></label><div class="tablewrap" id="studentTable"></div></section>`+(setTimeout(filterStudents,0),'')}function filterStudents(){const el=$('studentTable');if(!el)return;const q=$('search').value.toLowerCase();const rows=students.filter(s=>(s.name+' '+(s.school||'')).toLowerCase().includes(q));el.innerHTML=`<table><thead><tr><th>이름</th><th>학교</th><th>학년</th><th>반</th><th>관리</th></tr></thead><tbody>${rows.map(s=>`<tr><td data-label="이름">${esc(s.name)}</td><td data-label="학교">${esc(s.school)}</td><td data-label="학년">${esc(s.grade)}</td><td data-label="반">${esc(classes.find(c=>c.id===s.class_id)?.name||'미배정')}</td><td data-label="관리"><button class="secondary" onclick="editStudent('${s.id}')">수정</button> <button class="secondary" onclick="deleteRow('students','${s.id}')">삭제</button></td></tr>`).join('')||'<tr><td colspan="5">등록된 학생이 없습니다.</td></tr>'}</tbody></table>`}async function write(table,method,payload,id){try{let q=client.from(table);const result=method==='insert'?await q.insert(payload):method==='update'?await q.update(payload).eq('id',id):await q.delete().eq('id',id);if(result.error)throw result.error;await load()}catch(e){alert('저장 실패: '+e.message)}}async function addClass(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));await write('classes','insert',{name:d.name.trim(),grade:d.grade.trim()||null,teacher_name:d.teacher_name.trim()||null,schedule:d.schedule.trim()||null})}async function addStudent(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));await write('students','insert',{name:d.name.trim(),school:d.school.trim()||null,grade:d.grade,class_id:d.class_id||null})}function closeEditModal(){const root=$('editModalRoot');if(root)root.innerHTML='';document.body.classList.remove('modal-open')}
function openEditModal(title,fields,onSave){closeEditModal();const root=$('editModalRoot');root.innerHTML=`<div class="edit-overlay" id="editOverlay"><section class="edit-dialog" role="dialog" aria-modal="true" aria-labelledby="editTitle"><div class="edit-head"><h2 id="editTitle">${esc(title)}</h2><button type="button" class="edit-close" id="editClose" aria-label="닫기">×</button></div><form id="editForm"><div class="edit-fields">${fields}</div><p id="editError" class="edit-error" role="alert"></p><div class="edit-actions"><button type="button" class="secondary" id="editCancel">취소</button><button type="submit" class="primary" id="editSave">변경사항 저장</button></div></form></section></div>`;document.body.classList.add('modal-open');$('editClose').onclick=closeEditModal;$('editCancel').onclick=closeEditModal;$('editOverlay').onclick=e=>{if(e.target===$('editOverlay'))closeEditModal()};$('editForm').onsubmit=async e=>{e.preventDefault();const btn=$('editSave');btn.disabled=true;$('editError').textContent='';try{const ok=await onSave(new FormData(e.target));if(ok)closeEditModal()}catch(err){$('editError').textContent=err.message||String(err)}finally{btn.disabled=false}};const first=$('editForm').querySelector('input,select');if(first)first.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('editModalRoot')?.firstElementChild)closeEditModal()});
async function updateFromModal(table,id,payload){const result=await client.from(table).update(payload).eq('id',id);if(result.error)throw result.error;await load();return true}
function editClass(id){const c=classes.find(x=>x.id===id);if(!c)return;openEditModal('반 정보 수정',`<label class="wide">반 이름<input name="name" required maxlength="80" value="${esc(c.name)}"></label><label>학년<input name="grade" maxlength="30" value="${esc(c.grade)}"></label><label>담당 선생님<input name="teacher_name" maxlength="80" value="${esc(c.teacher_name)}"></label><label class="wide">시간표<input name="schedule" maxlength="200" value="${esc(c.schedule)}" placeholder="월·수 19:00~22:00"></label>`,async d=>{const name=String(d.get('name')||'').trim();if(!name)throw Error('반 이름을 입력해 주세요.');return updateFromModal('classes',id,{name,grade:String(d.get('grade')||'').trim()||null,teacher_name:String(d.get('teacher_name')||'').trim()||null,schedule:String(d.get('schedule')||'').trim()||null})})}
function editStudent(id){const s=students.find(x=>x.id===id);if(!s)return;const grades=['중1','중2','중3','고1','고2','고3'];if(s.grade&&!grades.includes(s.grade))grades.push(s.grade);const gradeOptions=grades.map(g=>`<option value="${esc(g)}" ${s.grade===g?'selected':''}>${esc(g)}</option>`).join('');const classOptions=`<option value="">미배정</option>`+classes.map(c=>`<option value="${esc(c.id)}" ${s.class_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('');openEditModal('학생 정보 수정',`<label class="wide">학생 이름<input name="name" required maxlength="80" value="${esc(s.name)}"></label><label class="wide">학교<input name="school" maxlength="100" value="${esc(s.school)}"></label><label>학년<select name="grade">${gradeOptions}</select></label><label>소속 반<select name="class_id">${classOptions}</select></label>`,async d=>{const name=String(d.get('name')||'').trim();if(!name)throw Error('학생 이름을 입력해 주세요.');return updateFromModal('students',id,{name,school:String(d.get('school')||'').trim()||null,grade:String(d.get('grade')||''),class_id:String(d.get('class_id')||'')||null})})}
async function deleteRow(table,id){if(!confirm('정말 삭제할까요?'))return;await write(table,'delete',null,id)}
/* 학습 기록: Supabase daily_records에만 저장하며 기존 학생·반 기능을 변경하지 않습니다. */
const recordState={mode:'class',date:localDate(),classId:'',studentId:'',month:localDate().slice(0,7),rows:[],history:[],busy:false};
function localDate(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
const attendanceNames={present:'출석',late:'지각',absent:'결석',makeup:'보강'};
const homeworkValues={A:100,B:70,C:50,D:30,E:10,F:0};
function attendanceSelect(v){return '<option value="">미입력</option>'+Object.entries(attendanceNames).map(([k,n])=>`<option value="${k}" ${v===k?'selected':''}>${n}</option>`).join('')}
function homeworkSelect(v){return '<option value="">미평가</option>'+Object.keys(homeworkValues).map(k=>`<option value="${k}" ${v===k?'selected':''}>${k}</option>`).join('')}
function recordMessage(msg,error=false){const el=$('recordMessage');if(el){el.className=error?'error':'success';el.textContent=msg}}
function homeworkPage(){return `<h1>학습 기록 관리</h1><p class="muted">수업별 출결과 숙제 이행도를 기록하고, 학생별 월간 기록을 조회·수정합니다.</p><div class="record-tabs"><button class="secondary ${recordState.mode==='class'?'active':''}" onclick="recordMode('class')">날짜별 반 전체 입력</button><button class="secondary ${recordState.mode==='student'?'active':''}" onclick="recordMode('student')">학생별 기록 조회·수정</button></div><div id="recordView"></div>`+(setTimeout(renderRecordView,0),'')}
function recordMode(mode){recordState.mode=mode;render()}
function renderRecordView(){const el=$('recordView');if(!el)return;if(recordState.mode==='class'){
 el.innerHTML=`<section class="panel"><h2>반 전체 입력</h2><div class="record-toolbar"><label>수업 날짜<input id="recordDate" type="date" value="${esc(recordState.date)}"></label><label>반 선택<select id="recordClass"><option value="">반을 선택해 주세요</option>${classes.map(c=>`<option value="${esc(c.id)}" ${recordState.classId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><button class="primary" onclick="fetchClassRecords()">기록 불러오기</button></div><p class="record-help">출결: 출석만 정규 출석으로 인정하며 지각·결석·보강은 별도 표시합니다. 숙제: A 100% · B 70% · C 50% · D 30% · E 10% · F 0%. 미평가는 숙제 평균에서 제외됩니다.</p></section><section class="panel"><h2>학생별 출결·숙제</h2><div id="recordRows"><p class="muted">날짜와 반을 선택한 후 기록 불러오기를 눌러 주세요.</p></div><p id="recordMessage" role="status"></p><div class="actions"><button class="primary" id="recordSave" onclick="saveClassRecords()" disabled>입력 내용 저장</button></div></section>`;
}else{
 el.innerHTML=`<section class="panel"><h2>학생별 월간 기록</h2><div class="record-toolbar"><label>학생 선택<select id="recordStudent"><option value="">학생을 선택해 주세요</option>${students.map(s=>`<option value="${esc(s.id)}" ${recordState.studentId===s.id?'selected':''}>${esc(s.name)} · ${esc(s.school||'학교 미입력')} · ${esc(s.grade||'학년 미입력')}</option>`).join('')}</select></label><label>조회 월<input type="month" id="recordMonth" value="${esc(recordState.month)}"></label><button class="primary" onclick="fetchStudentRecords()">월간 기록 조회</button></div><p class="record-help">과거 기록의 당시 반 정보도 함께 표시됩니다. 수정 버튼을 누르면 해당 날짜의 기록만 수정할 수 있습니다.</p></section><section class="panel"><h2>월간 기록 및 통계</h2><div id="recordHistory"><p class="muted">학생과 월을 선택해 조회해 주세요.</p></div><p id="recordMessage" role="status"></p></section>`;
}}
async function fetchClassRecords(){const c=$('recordClass')?.value,d=$('recordDate')?.value;if(!c||!d){recordMessage('반과 날짜를 모두 선택해 주세요.',true);return}recordState.classId=c;recordState.date=d;const box=$('recordRows');box.innerHTML='<p class="muted">기록을 불러오는 중...</p>';try{const {data,error}=await client.from('daily_records').select('id,student_id,class_id,record_date,attendance,homework_grade').eq('class_id',c).eq('record_date',d);if(error)throw error;const byStudent=new Map((data||[]).map(r=>[r.student_id,r]));recordState.rows=students.filter(s=>s.class_id===c).map(s=>({student:s,existing:byStudent.get(s.id)||null,attendance:byStudent.get(s.id)?.attendance||'',homework_grade:byStudent.get(s.id)?.homework_grade||''}));renderClassRows();recordMessage('저장된 기록을 불러왔어. 변경 후 저장하면 Supabase에 반영돼.')}catch(e){box.innerHTML='';recordMessage('조회 실패: '+e.message,true)}}
function renderClassRows(){const el=$('recordRows');if(!el)return;el.innerHTML=recordState.rows.length?recordState.rows.map((r,i)=>`<div class="record-row"><div class="record-name"><b>${esc(r.student.name)}</b><div class="muted">${esc(r.student.school||'학교 미입력')} · ${esc(r.student.grade||'')}</div></div><label>출결<select onchange="changeRecord(${i},'attendance',this.value)">${attendanceSelect(r.attendance)}</select></label><label>숙제<select onchange="changeRecord(${i},'homework_grade',this.value)">${homeworkSelect(r.homework_grade)}</select></label></div>`).join(''):'<p class="muted">이 반에 배정된 학생이 없어. 학생 관리에서 소속 반을 확인해 줘.</p>';$('recordSave').disabled=!recordState.rows.length}
function changeRecord(i,key,v){const r=recordState.rows[i];if(!r)return;r[key]=v;if(key==='attendance'&&v==='absent'&&!r.existing?.homework_grade){r.homework_grade='';renderClassRows()}}
async function saveClassRecords(){if(recordState.busy)return;const pending=recordState.rows.filter(r=>r.attendance||r.homework_grade);if(pending.some(r=>!r.attendance)){recordMessage('숙제 등급을 입력한 학생은 출결도 선택해 줘.',true);return}if(!pending.length){recordMessage('저장할 기록이 없어. 먼저 출결을 선택해 줘.',true);return}const rows=pending.map(r=>({student_id:r.student.id,class_id:recordState.classId,record_date:recordState.date,attendance:r.attendance,homework_grade:r.homework_grade||null}));recordState.busy=true;$('recordSave').disabled=true;try{const {error}=await client.from('daily_records').upsert(rows,{onConflict:'student_id,class_id,record_date'});if(error)throw error;recordMessage(`${rows.length}명의 기록을 저장했어!`);await fetchClassRecords()}catch(e){recordMessage('저장 실패: '+e.message,true)}finally{recordState.busy=false;if($('recordSave'))$('recordSave').disabled=false}}
async function fetchStudentRecords(){const sid=$('recordStudent')?.value,month=$('recordMonth')?.value;if(!sid||!month){recordMessage('학생과 조회 월을 선택해 줘.',true);return}recordState.studentId=sid;recordState.month=month;const start=month+'-01';const [year,m]=month.split('-').map(Number);const end=new Date(Date.UTC(year,m,1)).toISOString().slice(0,10);const box=$('recordHistory');box.innerHTML='<p class="muted">월간 기록을 불러오는 중...</p>';try{const {data,error}=await client.from('daily_records').select('id,student_id,class_id,record_date,attendance,homework_grade').eq('student_id',sid).gte('record_date',start).lt('record_date',end).order('record_date',{ascending:true});if(error)throw error;recordState.history=data||[];renderStudentHistory();recordMessage('월간 기록을 불러왔어.')}catch(e){box.innerHTML='';recordMessage('조회 실패: '+e.message,true)}}
function renderStudentHistory(){const el=$('recordHistory');if(!el)return;const rows=recordState.history;const regular=rows.filter(r=>r.attendance!=='makeup');const present=regular.filter(r=>r.attendance==='present').length;const rated=rows.filter(r=>r.homework_grade&&Object.hasOwn(homeworkValues,r.homework_grade));const hw=rated.length?(rated.reduce((s,r)=>s+homeworkValues[r.homework_grade],0)/rated.length).toFixed(1)+'%':'—';el.innerHTML=`<div class="record-stat"><span>기록된 정규 수업: <b>${regular.length}회</b></span><span>출석: <b>${present}회</b></span><span>기록 기준 출석률: <b>${regular.length?(present/regular.length*100).toFixed(1)+'%':'—'}</b></span><span>숙제 평균: <b>${hw}</b></span></div><p class="record-help">출석률은 현재 저장된 정규 수업 기록만 기준으로 계산한 임시 수치야. 정확한 월간 출석률은 추후 반별 예정 수업일을 연결해서 계산할 거야. 숙제 평균은 평가된 ${rated.length}회만 반영해.</p><div class="tablewrap"><table><thead><tr><th>날짜</th><th>당시 반</th><th>출결</th><th>숙제</th><th>관리</th></tr></thead><tbody>${rows.map(r=>`<tr><td data-label="날짜">${esc(r.record_date)}</td><td data-label="당시 반">${esc(classes.find(c=>c.id===r.class_id)?.name||'삭제된 반')}</td><td data-label="출결">${esc(attendanceNames[r.attendance]||r.attendance)}</td><td data-label="숙제">${esc(r.homework_grade||'미평가')}</td><td data-label="관리"><button class="secondary" onclick="editDailyRecord('${r.id}')">수정</button></td></tr>`).join('')||'<tr><td colspan="5">이 달에 저장된 기록이 없어.</td></tr>'}</tbody></table></div>`}
function editDailyRecord(id){const r=recordState.history.find(x=>x.id===id);if(!r)return;const title=`${r.record_date} 학습 기록 수정`;const fields=`<label class="wide">출결<select name="attendance" required>${attendanceSelect(r.attendance)}</select></label><label class="wide">숙제 등급<select name="homework_grade">${homeworkSelect(r.homework_grade||'')}</select></label>`;openEditModal(title,fields,async d=>{const attendance=String(d.get('attendance')||'');if(!attendance)throw Error('출결을 선택해 줘.');const homework_grade=String(d.get('homework_grade')||'')||null;const {error}=await client.from('daily_records').update({attendance,homework_grade}).eq('id',id);if(error)throw error;await fetchStudentRecords();return true})}

/* 성적 관리: monthly_tests / test_scores, 관리자 RLS 적용 */
const scoreState={mode:'class',classId:'',testId:'',studentId:'',tests:[],scores:[],history:[],busy:false};
function scoreMsg(message,isError=false){const el=$('scoreMessage');if(el){el.className=isError?'error':'success';el.textContent=message}}
function scoreTestName(t){const c=classes.find(x=>x.id===t.class_id);return `${t.test_date} · ${t.test_name} (${c?.name||'반 정보 없음'}, ${t.max_score}점 만점)`}
function scoresPage(){return `<h1>성적 관리</h1><p class="muted">시험 등록 · 반별 점수 일괄 입력 · 학생별 성적 조회 및 수정</p><div class="score-tabs"><button class="secondary ${scoreState.mode==='class'?'active':''}" onclick="scoreMode('class')">시험 등록·반별 입력</button><button class="secondary ${scoreState.mode==='student'?'active':''}" onclick="scoreMode('student')">학생별 성적 조회·수정</button></div><div id="scoreView"></div>`+(setTimeout(renderScoreView,0),'')}
function scoreMode(mode){scoreState.mode=mode;render()}
function renderScoreView(){const el=$('scoreView');if(!el)return;
if(scoreState.mode==='class'){
el.innerHTML=`<section class="panel"><h2>새 시험 등록</h2><form id="newTestForm" onsubmit="createMonthlyTest(event)"><div class="fields"><label>반 선택<select name="class_id" required><option value="">반 선택</option>${classes.map(c=>`<option value="${esc(c.id)}" ${scoreState.classId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>시험명<input name="test_name" required maxlength="100" placeholder="11월 성취도평가"></label><label>시험 날짜<input type="date" name="test_date" value="${localDate()}" required></label><label>만점<input type="number" name="max_score" min="0.01" max="999999.99" step="0.01" value="100" required></label></div><div class="actions"><button class="primary" type="submit">시험 등록</button></div></form></section><section class="panel"><h2>반별 시험 점수 입력</h2><div class="score-grid"><label>반 선택<select id="scoreClass" onchange="scoreClassChanged(this.value)"><option value="">반 선택</option>${classes.map(c=>`<option value="${esc(c.id)}" ${scoreState.classId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>등록된 시험<select id="scoreTest"><option value="">시험 선택</option></select></label><button class="primary" onclick="fetchTestScores()">점수 불러오기</button></div><div class="actions"><button class="secondary" id="deleteTestButton" onclick="deleteMonthlyTest()" disabled>선택한 시험 삭제</button></div><p class="record-help">미응시·미입력 학생의 점수는 빈칸으로 두세요. 저장된 점수를 빈칸으로 바꾸면 해당 점수 기록이 삭제됩니다. 반 평균은 입력된 점수만으로 계산합니다.</p><div id="scoreRows"><p class="muted">반과 시험을 선택하고 점수 불러오기를 눌러 주세요.</p></div><p id="scoreMessage" role="status"></p><div class="actions"><button id="scoreSave" class="primary" onclick="saveTestScores()" disabled>점수 저장</button></div></section>`;
refreshTestOptions();
}else{
el.innerHTML=`<section class="panel"><h2>학생별 성적 조회</h2><div class="record-toolbar"><label>학생 선택<select id="scoreStudent"><option value="">학생 선택</option>${students.map(s=>`<option value="${esc(s.id)}" ${scoreState.studentId===s.id?'selected':''}>${esc(s.name)} · ${esc(s.school||'학교 미입력')} · ${esc(s.grade||'학년 미입력')}</option>`).join('')}</select></label><button class="primary" onclick="fetchStudentScores()">성적 조회</button></div><p class="record-help">학생의 시험별 점수, 당시 반 평균, 평균과의 차이를 확인하고 점수를 수정할 수 있습니다.</p></section><section class="panel"><h2>성적 기록</h2><div id="scoreHistory"><p class="muted">학생을 선택하고 성적 조회를 눌러 주세요.</p></div><p id="scoreMessage" role="status"></p></section>`;
}}
async function createMonthlyTest(e){e.preventDefault();if(scoreState.busy)return;const form=e.target;const d=new FormData(form);const class_id=String(d.get('class_id')||''),test_name=String(d.get('test_name')||'').trim(),test_date=String(d.get('test_date')||'');const max_score=Number(d.get('max_score'));
if(!class_id||!test_name||!test_date||!Number.isFinite(max_score)||max_score<=0){alert('시험 정보를 모두 정확하게 입력해 주세요.');return}
scoreState.busy=true;const btn=form.querySelector('button[type="submit"]');btn.disabled=true;
try{const {data,error}=await client.from('monthly_tests').insert({class_id,test_name,test_date,max_score}).select('id').single();if(error)throw error;scoreState.classId=class_id;scoreState.testId=data.id;await loadScoreTests();renderScoreView();scoreMsg('시험을 등록했어! 아래에서 점수를 불러와 입력해 줘.');}
catch(err){alert('시험 등록 실패: '+err.message)}finally{scoreState.busy=false;if(btn.isConnected)btn.disabled=false}}
async function loadScoreTests(){const {data,error}=await client.from('monthly_tests').select('id,class_id,test_name,test_date,max_score').order('test_date',{ascending:false});if(error)throw error;scoreState.tests=data||[]}
function scoreClassChanged(id){scoreState.classId=id;scoreState.testId='';scoreState.scores=[];refreshTestOptions();const box=$('scoreRows');if(box)box.innerHTML='<p class="muted">시험을 선택한 후 점수 불러오기를 눌러 주세요.</p>';if($('scoreSave'))$('scoreSave').disabled=true;scoreMsg('')}
function refreshTestOptions(){const el=$('scoreTest');if(!el)return;const options=scoreState.tests.filter(t=>t.class_id===scoreState.classId);if(!options.some(t=>t.id===scoreState.testId))scoreState.testId='';el.innerHTML='<option value="">시험 선택</option>'+options.map(t=>`<option value="${esc(t.id)}" ${scoreState.testId===t.id?'selected':''}>${esc(t.test_date)} · ${esc(t.test_name)}</option>`).join('');el.onchange=()=>{scoreState.testId=el.value;const b=$('deleteTestButton');if(b)b.disabled=!el.value||scoreState.busy;const box=$('scoreRows');if(box)box.innerHTML='<p class="muted">점수 불러오기를 눌러 주세요.</p>';if($('scoreSave'))$('scoreSave').disabled=true};const b=$('deleteTestButton');if(b)b.disabled=!el.value||scoreState.busy}
async function deleteMonthlyTest(){
if(scoreState.busy)return;
const id=$('scoreTest')?.value;
const test=scoreState.tests.find(t=>t.id===id);
if(!test){scoreMsg('삭제할 시험을 먼저 선택해 줘.',true);return}
const className=classes.find(c=>c.id===test.class_id)?.name||'반 정보 없음';
if(!confirm(`시험 삭제 확인\n\n${test.test_date} · ${test.test_name}\n반: ${className}\n\n이 시험과 학생별 점수가 모두 영구 삭제돼. 계속할까?`))return;
scoreState.busy=true;
const button=$('deleteTestButton');if(button)button.disabled=true;
try{
 const {data,error}=await client.from('monthly_tests').delete().eq('id',id).select('id');
 if(error)throw error;
 if(!data?.length)throw Error('삭제된 시험이 없어. 관리자 권한을 확인해 줘.');
 scoreState.testId='';scoreState.scores=[];
 await loadScoreTests();refreshTestOptions();
 const box=$('scoreRows');if(box)box.innerHTML='<p class="muted">시험이 삭제됐어. 다른 시험을 선택해 줘.</p>';
 if($('scoreSave'))$('scoreSave').disabled=true;
 scoreMsg(`「${test.test_name}」 시험과 연결된 점수를 삭제했어.`);
}catch(err){scoreMsg('시험 삭제 실패: '+err.message,true)}
finally{scoreState.busy=false;const b=$('deleteTestButton');if(b)b.disabled=!$('scoreTest')?.value}
}

async function statAll(table,columns,configure){
 let out=[];
 for(let from=0;from<10000;from+=1000){
  let q=client.from(table).select(columns);q=configure(q);
  const {data,error}=await q.range(from,from+999);
  if(error)throw error;
  out.push(...(data||[]));
  if(!data||data.length<1000)return out;
 }
 throw Error('조회 기록이 너무 많습니다. 기간을 줄여 주세요.');
}

function statCard(label,value,sub=''){return `<div class="stat-card"><small>${esc(label)}</small><strong>${esc(value)}</strong><em>${esc(sub)}</em></div>`}
function statChart(data,series,{max=100,bar=false,labels=[]}={}){
 if(!data.length)return '<p class="muted">표시할 성적 데이터가 없습니다.</p>';
 const W=Math.max(620,bar?data.length*72+100:620),H=285,L=52,R=24,T=22,B=58,PW=W-L-R,PH=H-T-B;
 const x=i=>bar?L+PW*(i+.5)/data.length:L+PW*(data.length===1?.5:i/(data.length-1));
 const y=v=>T+PH*(1-Math.max(0,Math.min(max,v))/max);
 let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(labels.join(', ')||'성적 그래프')}">`;
 for(let i=0;i<=4;i++){const val=max*i/4,Y=y(val);svg+=`<line x1="${L}" y1="${Y}" x2="${W-R}" y2="${Y}" stroke="#393939"/><text x="${L-9}" y="${Y+4}" text-anchor="end" fill="#aaa" font-size="11">${statFmt(val)}</text>`}
 if(bar){
  data.forEach((d,i)=>{const v=d[series[0].key];if(v===null||v===undefined)return;const bw=Math.min(45,PW/data.length*.6),X=x(i)-bw/2,Y=y(v);svg+=`<rect x="${X}" y="${Y}" width="${bw}" height="${T+PH-Y}" rx="4" fill="#8cc7f2"/><text x="${x(i)}" y="${Y-7}" fill="#eee" text-anchor="middle" font-size="11">${statFmt(v)}</text>`});
 }else{
  series.forEach(s=>{const pts=data.map((d,i)=>d[s.key]===null||d[s.key]===undefined?null:[x(i),y(d[s.key])]);let segment=[];function draw(){if(segment.length>1)svg+=`<polyline points="${segment.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;segment=[]}
   pts.forEach(p=>{if(!p){draw();return}segment.push(p)});draw();
   pts.forEach(p=>{if(p)svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${s.color}"/>`});
  });
 }
 data.forEach((d,i)=>{const text=String(d.label??'');const short=text.length>9?text.slice(0,8)+'…':text;svg+=`<text x="${x(i)}" y="${H-31}" fill="#bbb" font-size="11" text-anchor="middle">${esc(short)}</text>`});
 svg+='</svg>';
 return `<div class="stat-chart">${svg}</div><div class="stat-legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function statMonthlyTrend(tests,scores,month,studentId=null,count=6){
 const months=statMonths(month,count),byTest=new Map();
 for(const s of scores){if(!byTest.has(s.test_id))byTest.set(s.test_id,[]);byTest.get(s.test_id).push(s)}
 return months.map(m=>{
  const matching=tests.filter(t=>t.test_date.startsWith(m));
  const own=[],avg=[];
  matching.forEach(t=>{const entries=byTest.get(t.id)||[];if(!entries.length)return;const max=Number(t.max_score);const mean=statMean(entries.map(s=>Number(s.score)/max*100));avg.push(mean);if(studentId){const row=entries.find(s=>s.student_id===studentId);if(row)own.push(Number(row.score)/max*100)}});
  return {label:m.slice(5)+'월',student:statMean(own),average:statMean(avg)};
 });
}

   average:statMean(entries.map(r=>Number(r.score)/maximum*100))};
 });
 el.innerHTML=`<section class="panel"><h2>${esc(s.name)} 학생 <span class="muted">${esc(s.school||'학교 미입력')} · ${esc(s.grade||'학년 미입력')}</span></h2><div class="stat-cards">${statCard('기록 기준 출석률',regular.length?statFmt(present/regular.length*100,'%'):'—',`${present}/${regular.length}회 출석`)}${statCard('숙제 평균',statFmt(hw,'%'),`평가된 ${rated.length}회만 반영`)}${statCard('최근 시험 점수',own?statFmt(own.score,'점'):'—',newest?newest.test_name:'이번 달 시험 기록 없음')}${statCard('해당 시험 반 평균',statFmt(avg,'점'),newest?`${newest.max_score}점 만점`:'이번 달 시험 기록 없음')}</div><p class="record-help">출석률은 현재 저장된 정규 수업 기록만 기준으로 계산한 임시 수치입니다. 보강은 분모에서 제외하고 지각·결석은 출석으로 인정하지 않습니다. 정확한 출석률은 예정 수업일 연결 후 계산할 수 있습니다. 숙제 미평가는 평균에서 제외됩니다.</p></section><section class="panel"><h2>최근 응시 시험 6개 · 성적 추이</h2><p class="record-help">조회 월과 관계없이 실제 응시한 최신 시험 최대 6개를 날짜순으로 표시합니다. 시험 만점이 다르면 100점 기준 비율(%)로 환산하며, 각 시험의 반 평균과 비교합니다.</p>${statChart(trend,[{key:'student',name:'학생 점수',color:'#8cc7f2'},{key:'average',name:'해당 시험 반 평균',color:'#e7b27d'}],{labels:['학생 점수','반 평균']})}</section><section class="panel"><h2>선택 월 시험 기록</h2><div class="tablewrap"><table><thead><tr><th>날짜</th><th>시험명</th><th>개인 점수</th><th>반 평균</th><th>평균 대비</th></tr></thead><tbody>${monthly.map(t=>{const arr=statState.scores.filter(x=>x.test_id===t.id),mine=arr.find(x=>x.student_id===s.id),mean=statMean(arr.map(x=>Number(x.score)));return `<tr><td data-label="날짜">${esc(t.test_date)}</td><td data-label="시험">${esc(t.test_name)}</td><td data-label="개인 점수">${mine?statFmt(mine.score,'점'):'—'}</td><td data-label="반 평균">${statFmt(mean,'점')}</td><td data-label="평균 대비">${mine&&mean!==null?statFmt(Number(mine.score)-mean,'점'):'—'}</td></tr>`}).join('')||'<tr><td colspan="5">이번 달 응시한 시험이 없습니다.</td></tr>'}</tbody></table></div></section>`;
}
function renderClassStatistics(){
 const el=$('statResult'),cls=classes.find(x=>x.id===statState.classId);if(!cls)return;
 const tests=statState.tests,monthly=tests.filter(t=>t.test_date.startsWith(statState.month)).sort((a,b)=>b.test_date.localeCompare(a.test_date));
 if(!monthly.some(t=>t.id===statState.testId))statState.testId=monthly[0]?.id||'';
 const test=tests.find(t=>t.id===statState.testId);
 let html=`<section class="panel"><h2>${esc(cls.name)} · 시험별 성적</h2><label>시험 선택<select id="statTest" onchange="statState.testId=this.value;renderClassStatistics()"><option value="">시험 없음</option>${statOptions(monthly,statState.testId,t=>`${t.test_date} · ${t.test_name}`)}</select></label>`;
 if(test){
  const entries=statState.scores.filter(x=>x.test_id===test.id).map(x=>({...x,student:students.find(s=>s.id===x.student_id)})).sort((a,b)=>Number(b.score)-Number(a.score)||String(a.student?.name||'').localeCompare(String(b.student?.name||''),'ko'));
  const avg=statMean(entries.map(x=>Number(x.score))),highest=entries.length?Number(entries[0].score):null;
  const data=entries.map((x,i)=>({label:x.student?.name||'미등록 학생',score:Number(x.score)}));
  html+=`<div class="stat-cards">${statCard('반 평균',statFmt(avg,'점'),`${test.max_score}점 만점`)}${statCard('최고점',statFmt(highest,'점'))}${statCard('응시 인원',entries.length+'명','점수 입력 학생 기준')}${statCard('등록 학생',students.filter(s=>s.class_id===cls.id).length+'명')}</div><h2>학생별 시험 점수 · 높은 점수순</h2>${statChart(data,[{key:'score',name:'학생 점수',color:'#8cc7f2'}],{bar:true,max:Number(test.max_score)})}<p class="record-help">반 평균: ${statFmt(avg,'점')} · 미응시 및 점수 미입력 학생은 제외됩니다.</p><h2 style="margin-top:24px">점수 순위표</h2><div class="tablewrap"><table><thead><tr><th>순위</th><th>이름</th><th>학교</th><th>학년</th><th>점수</th></tr></thead><tbody>${entries.map(x=>{const rank=1+entries.filter(y=>Number(y.score)>Number(x.score)).length;return `<tr><td data-label="순위">${rank}위</td><td data-label="이름">${esc(x.student?.name||'미등록 학생')}</td><td data-label="학교">${esc(x.student?.school||'—')}</td><td data-label="학년">${esc(x.student?.grade||'—')}</td><td data-label="점수">${statFmt(x.score,'점')}</td></tr>`}).join('')||'<tr><td colspan="5">점수가 입력된 학생이 없습니다.</td></tr>'}</tbody></table></div>`;
 }else html+='<p class="muted">선택한 월에 등록된 시험이 없습니다.</p>';
 html+='</section>';
 const trend=statMonthlyTrend(tests,statState.scores,statState.month,null,3);
 html+=`<section class="panel"><h2>최근 3개월 반 평균 성적 추이</h2><p class="record-help">서로 만점이 다른 시험은 100점 기준 비율(%)로 환산합니다. 같은 달 여러 시험이 있으면 시험별 반 평균의 평균을 표시합니다.</p>${statChart(trend,[{key:'average',name:'반 평균',color:'#8cc7f2'}],{labels:['반 평균']})}</section>`;
 el.innerHTML=html;
}

boot();
</script></body></html>
